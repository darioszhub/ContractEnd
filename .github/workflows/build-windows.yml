name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build ContractEnd for Windows
    runs-on: windows-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Create ZIP archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "pages" | Out-Null

          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "pages\ContractEnd-windows.zip" `
            -Force

          @"
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ContractEnd - Latest Build</title>
          </head>
          <body>
            <h1>ContractEnd</h1>
            <p>Latest Windows build</p>
            <p>
              <a href="ContractEnd-windows.zip">
                Download ContractEnd for Windows
              </a>
            </p>
          </body>
          </html>
          "@ | Out-File -FilePath "pages\index.html" -Encoding utf8

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4